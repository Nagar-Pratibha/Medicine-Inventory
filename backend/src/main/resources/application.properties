spring.datasource.url=${MEDS_DB_URL:jdbc:mysql://localhost:3306/meds2}
spring.datasource.username=${MEDS_DB_USERNAME:root}
spring.datasource.password=${MEDS_DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
server.port=8099
spring.jpa.hibernate.ddl-auto=update
debug=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT signing key: BASE64-encoded, at least 256 bits.
# Set MEDS_JWT_SECRET in the environment for any deployed instance.
# When left empty (local dev) a random key is generated at startup, which means
# tokens issued before a restart stop working - that is intentional.
jwt.secret.key=${MEDS_JWT_SECRET:}
